name: Vytal HC-05 Android Build
on:
  push:
    branches: [ "vytal-hc05-v1" ]
    paths:
      - "hc05-command-center/**"
      - ".github/workflows/vytal-hc05.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "hc05-command-center/**"
      - ".github/workflows/vytal-hc05.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle -p hc05-command-center :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vytal-command-center-debug-apk
          path: hc05-command-center/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
