name: Vytal Command Center Android Build
on:
  workflow_dispatch:
  push:
    branches: [hc05-command-center-v1]
    paths:
      - 'bluetooth-command-center/**'
      - '.github/workflows/vytal-command-center.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: bluetooth-command-center
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vytal-command-center-debug-apk
          path: bluetooth-command-center/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
